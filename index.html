<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🚚 Грузовая компания РФ — Калькулятор перевозок</title>
    <style>
        /* ===== ВСЕ СТИЛИ ИЗ ПРЕДЫДУЩЕЙ ВЕРСИИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.15;
            padding-right: 16px;
            border-right: 2px solid #e2e8f0;
        }

        .logo .company {
            font-size: 14px;
            font-weight: 800;
            color: #1a202c;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .logo .rf {
            font-size: 11px;
            font-weight: 700;
            color: #4299e1;
            letter-spacing: 3px;
        }

        .logo .full {
            font-size: 9px;
            font-weight: 600;
            color: #4a5568;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1a202c;
        }

        .version {
            font-size: 12px;
            color: #a0aec0;
            background: #edf2f7;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
            padding-left: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 6px;
            font-size: 14px;
        }

        select,
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
            background: white;
            color: #1a202c;
            -webkit-appearance: none;
            appearance: none;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .unit-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .unit-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s;
            color: #4a5568;
        }

        .unit-btn.active {
            background: #4299e1;
            color: white;
            border-color: #4299e1;
        }

        .unit-btn:hover:not(.active) {
            border-color: #4299e1;
        }

        .calc-btn {
            width: 100%;
            padding: 14px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calc-btn:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }

        .calc-btn:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 30px;
        }

        .result-item {
            background: #f7fafc;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border-left: 4px solid #4299e1;
            transition: all 0.2s;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-item:hover {
            transform: translateX(6px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .result-item.best {
            border-left-color: #48bb78;
            background: #f0fff4;
        }

        .result-item.our-truck {
            border-left-color: #9f7aea;
            background: #faf5ff;
        }

        .result-item.our-truck .result-carrier {
            color: #6b46c1;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .result-carrier {
            font-weight: 700;
            font-size: 18px;
            color: #1a202c;
        }

        .result-price {
            font-weight: 700;
            font-size: 20px;
            color: #2b6cb0;
        }

        .result-price.best-price {
            color: #38a169;
        }

        .result-details {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #718096;
            flex-wrap: wrap;
            margin-top: 8px;
            align-items: center;
        }

        .result-details span {

            align-items: center;
            gap: 4px;
        }

            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #4a5568;
        }

        .badge.best-badge {
            background: #48bb78;
            color: white;
        }

        .badge.our-badge {
            background: #9f7aea;
            color: white;
        }

        .badge.no-margin-badge {
            background: #f6ad55;
            color: white;
        }

        .badge.min-badge {
            background: #ed8936;
            color: white;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
        }

        .no-results .emoji {
            font-size: 48px;
            margin-bottom: 16px;
        }

        
        .history {
            margin-top: 30px;
            border-top: 2px solid #edf2f7;
            padding-top: 20px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-header h3 {
            color: #2d3748;
            font-size: 16px;
        }

        .clear-history {
            background: none;
            border: none;
            color: #fc8181;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .clear-history:hover {
            background: #fff5f5;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #f7fafc;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            flex-wrap: wrap;
            gap: 6px;
        }

        .history-item:hover {
            background: #edf2f7;
        }

        .history-item .route {
            color: #2d3748;
            font-weight: 500;
        }

        .history-item .info {
            color: #718096;
            font-size: 12px;
        }

        .history-item .hprice {
            color: #2b6cb0;
            font-weight: 600;
        }

        .history-item .hcost {
            color: #a0aec0;
            font-size: 12px;
            text-decoration: line-through;
        }

        .history-empty {
            color: #a0aec0;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        .history-item.our-history {
            background: #faf5ff;
            border-left: 3px solid #9f7aea;
        }


        @media (max-width: 768px) {
            .margin-summary {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .margin-summary-item {
                flex-direction: row;
                justify-content: space-between;
                width: 100%;
            }

            .margin-summary-item .label {
                font-size: 12px;
            }

            .margin-summary-item .value {
                font-size: 16px;
            }

            .header-left {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 16px;
                border-radius: 12px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 18px;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .margin-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
            }

            .margin-label {
                min-width: auto;
            }

            .margin-settings {
                flex-direction: column;
                align-items: stretch;
            }

            .margin-settings input {
                width: 100%;
            }

            .logo {
                padding-right: 10px;
                border-right: 1px solid #e2e8f0;
            }

            .logo .company {
                font-size: 11px;
            }

            .logo .rf {
                font-size: 9px;
                letter-spacing: 2px;
            }

            .logo .full {
                font-size: 7px;
            }
        }

<body>

    <div class="container">
        <!-- ШАПКА С ЛОГОТИПОМ -->
        <div class="header">
            <div class="header-left">
                <div class="logo">
                    <span class="company">ГРУЗОВАЯ КОМПАНИЯ</span>
                    <span class="rf">РФ</span>
                    <span class="full">ТРАНСПОРТНАЯ ГРУЗОВАЯ КОМПАНИЯ</span>
                </div>
                <h1>🚚 Калькулятор грузоперевозок</h1>
            </div>
            <span class="version">v4.0 · Прайс</span>
        </div>
        <p class="subtitle">Точный расчёт по актуальному прайсу · плотность груза 250 кг/м³</p> 
        <!-- ВЫБОР МАРШРУТА -->
        <div class="row">
            <div class="form-group">
                <label>📍 Откуда</label>
                <select id="fromCity">
                    <option value="">Выберите город</option>
                </select>
            </div>
            <div class="form-group">
                <label>📍 Куда</label>
                <select id="toCity" disabled>
                    <option value="">Сначала выберите "Откуда"</option>
                </select>
            </div>
        </div>

        <!-- ЕДИНИЦЫ ИЗМЕРЕНИЯ -->
        <div class="form-group">
            <label>Единица измерения</label>
            <div class="unit-toggle">
                <button class="unit-btn active" data-unit="kg">📦 За кг</button>
                <button class="unit-btn" data-unit="m3">📐 За м³</button>
            </div>
        </div>

        <!-- ЗНАЧЕНИЕ -->
        <div class="form-group">
            <label id="valueLabel">Вес (кг)</label>
            <input type="number" id="valueInput" placeholder="Например: 150" min="0.1" step="0.1" />
        </div>

        <!-- КНОПКА РАСЧЁТА -->
        <button class="calc-btn" id="calcBtn">🧮 Рассчитать стоимость</button>
<div class="kp-actions"><button class="kp-btn" id="addToKpBtn" type="button">➕ Добавить расчёт в КП</button><button class="kp-btn" id="generateKpBtn" type="button">📄 Сформировать PDF КП</button></div><div id="kpStatus" class="kp-status"></div><div id="kpCart" class="kp-cart"></div>

        <!-- РЕЗУЛЬТАТЫ -->

            </div>
            <div id="historyList"></div>
        </div>

    <script>
const DENSITY_KG_PER_M3 = 250;
const tariffsDB = [["Москва","Новосибирск",10710,"3"],["Москва","Екатеринбург",6503,"2"],["Москва","Иркутск",15300,"6"],["Москва","Казань",6248,"1"],["Москва","Кемерово",12623,"4"],["Москва","Краснодар",6822,"2"],["Москва","Красноярск",13543,"5"],["Москва","Новокузнецк",12495,"4"],["Москва","Омск",10073,"3"],["Москва","Пермь",7215,"4"],["Москва","Санкт-Петербург",5738,"2"],["Москва","Томск",12495,"4"],["Москва","Тюмень",8735,"4"],["Москва","Уфа",6120,"2"],["Москва","Челябинск",6630,"2"],["Новосибирск","Иркутск",7650,"2"],["Новосибирск","Краснодар",9308,"6"],["Новосибирск","Красноярск",4782,"1"],["Новосибирск","Москва",6375,"4"],["Новосибирск","Омск",3825,"1"],["Новосибирск","Пермь",6185,"4"],["Новосибирск","Санкт-Петербург",7905,"5"],["Новосибирск","Тюмень",4845,"4"],["Новосибирск","Уфа",7395,"2"],["Новосибирск","Челябинск",5610,"2"],["Новосибирск","Екатеринбург",4782,"2"],["Новосибирск","Барнаул",3698,"1"],["Новосибирск","Кемерово",3698,"1"],["Новосибирск","Новокузнецк",4017,"1"],["Новосибирск","Томск",3698,"1"],["Новосибирск","Чита",7500,"2"],["Новосибирск","Хабаровск",10000,"4"],["Новосибирск","Владивосток",10000,"5"],["Новосибирск","Благовещенск",14350,"6-7"],["Новосибирск","Комсомольск-на-Амуре",13900,"6-7"],["Новосибирск","Южно-Сахалинск (хаб)",27970,"12"],["Новосибирск","Магадан",25120,"17-21"],["Новосибирск","Петропавловск-Камчатский",22927,"17-21"],["Новосибирск","Находка",15692,"6-7"],["Новосибирск","Уссурийск",14160,"6-7"],["Новосибирск","Южно-Сахалинск (Влд)",23524,"17-20"]].map(([from,to,m3Price,delivery]) => ({
    from, to, carrier: "Тариф по прайсу",
    m3Price,
    kgPrice: m3Price / DENSITY_KG_PER_M3,
    minSum: 0,
    delivery,
    type: "Авто",
    isOurTruck: false,
    isFinalPrice: false
}));

function getTariff(from, to) {
    return tariffsDB.find(t => t.from === from && t.to === to) || null;
}
function calculatePrice(from, to, value, unit) {
    const route = getTariff(from, to);
    if (!route) return { error: "Для выбранного направления тариф пока не загружен." };
    const unitPrice = unit === "kg" ? route.kgPrice : route.m3Price;
    const rawPrice = value * unitPrice;
    const price = Math.round(rawPrice);
    return [{
        ...route,
        price,
        costPrice: price,
        unitPrice,
        priceWithMargin: price,
        marginRub: 0,
        marginPercent: 0,
        marginMultiplier: 1,
        usedMinSum: false
    }];
}
function calculateWithMargin(from, to, value, unit) {
    return calculatePrice(from, to, value, unit);
}

const fromSelect = document.getElementById("fromCity");
const toSelect = document.getElementById("toCity");
const valueInput = document.getElementById("valueInput");
const valueLabel = document.getElementById("valueLabel");
const calcBtn = document.getElementById("calcBtn");
const resultsContainer = document.getElementById("resultsContainer");
const historyList = document.getElementById("historyList");
const clearHistoryBtn = document.getElementById("clearHistory");

const cities = [...new Set(tariffsDB.map(t => t.from))].sort((a,b)=>a.localeCompare(b,"ru"));
cities.forEach(city => {
    const option = document.createElement("option");
    option.value = city; option.textContent = city; fromSelect.appendChild(option);
});

fromSelect.addEventListener("change", function() {
    const from = this.value;
    toSelect.innerHTML = '<option value="">Выберите город</option>';
    toSelect.disabled = !from;
    if (!from) return;
    [...new Set(tariffsDB.filter(t=>t.from===from).map(t=>t.to))]
      .sort((a,b)=>a.localeCompare(b,"ru"))
      .forEach(city => {
        const option=document.createElement("option");
        option.value=city; option.textContent=city; toSelect.appendChild(option);
      });
});

function getHistory(){try{return JSON.parse(localStorage.getItem("calcHistory"))||[]}catch{return[]}}
function saveHistory(entry){
    const history=getHistory();
    history.unshift({...entry,timestamp:new Date().toLocaleString("ru-RU")});
    if(history.length>50) history.pop();
    localStorage.setItem("calcHistory",JSON.stringify(history)); renderHistory();
}
function clearHistory(){localStorage.removeItem("calcHistory");renderHistory();}
function renderHistory(){
    const history=getHistory();
    if(!history.length){historyList.innerHTML='<div class="history-empty">История расчётов пуста</div>';return;}
    historyList.innerHTML=history.map((item,index)=>`
      <div class="history-item" data-index="${index}">
        <span class="route">${item.from} → ${item.to}</span>
        <span class="info">${item.value} ${item.unit} · ${item.carrier}</span>
        <span class="hprice">${(item.priceWithMargin||0).toLocaleString("ru-RU")} ₽</span>
      </div>`).join("");
    historyList.querySelectorAll(".history-item").forEach(el=>el.addEventListener("click",()=>{
      const item=getHistory()[parseInt(el.dataset.index)];
      if(!item)return;
      fromSelect.value=item.from; fromSelect.dispatchEvent(new Event("change"));
      setTimeout(()=>{toSelect.value=item.to;},50);
      const b=document.querySelector(`.unit-btn[data-unit="${item.unit}"`);
      if(b)b.click(); valueInput.value=item.value; setTimeout(()=>calcBtn.click(),100);
    }));
}

function kpSetStatus(text,type=""){kpStatus.textContent=text;kpStatus.className="kp-status "+type;}
function formatNumber(value,digits=0){return Number(value).toLocaleString("ru-RU",{minimumFractionDigits:digits,maximumFractionDigits:digits});}
function escapeHtml(v){const d=document.createElement("div");d.textContent=String(v);return d.innerHTML;}

}
function renderKpCart(){

async function getStoredTemplate(){
 if(!kpTemplatePromise){
  kpTemplatePromise=fetch(KP_TEMPLATE_URL,{cache:"force-cache"}).then(r=>{if(!r.ok)throw new Error("Не удалось загрузить встроенный Word-шаблон");return r.text();}).then(b64=>{
   const clean=b64.replace(/\s/g,""),bin=atob(clean),bytes=new Uint8Array(bin.length);
   for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
   return bytes;
  });
 }
 return kpTemplatePromise;
}
function xmlEsc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function replaceCellText(cell,text,secondLine=""){
 const tcPrEnd=cell.indexOf("</w:tcPr>"); if(tcPrEnd<0)return cell;
 const prefix=cell.slice(0,tcPrEnd+9);
 const p1='<w:p><w:pPr><w:spacing w:before="60" w:after="60"/></w:pPr><w:r><w:t>'+xmlEsc(text)+'</w:t></w:r></w:p>';
 const p2=secondLine?'<w:p><w:pPr><w:spacing w:before="0" w:after="60"/></w:pPr><w:r><w:rPr><w:color w:val="5D6F89"/><w:sz w:val="15"/></w:rPr><w:t>'+xmlEsc(secondLine)+'</w:t></w:r></w:p>':"";
 return prefix+p1+p2+"</w:tc>";
}
function deliveryLabel(value){
 const s=String(value).trim();
 if(/дн|день|дня|дней/i.test(s))return s;
 if(s.includes("-"))return s.replace(/-/g,"–")+" дней";
 const n=Number(s); if(n===1)return "1 день"; if(n>=2&&n<=4)return s+" дня"; return s+" дней";
}
function setRowData(row,item,index){
 const cells=row.match(/<w:tc(?:\s|>)[\s\S]*?<\/w:tc>/g); if(!cells||cells.length<4)return row;
 const displayUnit=item.unit==="kg"?formatNumber(Math.round(item.weight))+" кг":formatNumber(item.volume,3)+" м³";
 const newCells=[
  replaceCellText(cells[0],item.from+" → "+item.to),
  replaceCellText(cells[1],displayUnit),
  replaceCellText(cells[2],deliveryLabel(item.delivery)),
  replaceCellText(cells[3],formatNumber(item.m3Price)+" ₽/м³","Стоимость: "+formatNumber(item.price)+" ₽")
 ];
 for(let i=0;i<4;i++)row=row.replace(cells[i],newCells[i]);
 const fill=index%2===0?"EAF3FC":"F7FAFE";
 return row.replace(/<w:shd\b[^>]*\/>/g,function(m){return m.replace(/w:fill="[^"]*"/,'w:fill="'+fill+'"');});
}
async function makeTemplateDocx(items){
 if(items.length>10)throw new Error("В КП можно добавить максимум 10 направлений.");
 const bytes=await getStoredTemplate();
 const zip=await JSZip.loadAsync(bytes);
 let xml=await zip.file("word/document.xml").async("string");
 const tbls=xml.match(/<w:tbl(?:\s|>)[\s\S]*?<\/w:tbl>/g)||[];
 let target=null;
 for(const t of tbls)if(t.includes("НАПРАВЛЕНИЕ")&&t.includes("ВЕС / ОБЪЁМ")&&t.includes("ТАРИФ ЗА 1 М³")){target=t;break;}
 if(!target)throw new Error("TABLE_NOT_FOUND");
 const rows=target.match(/<w:tr(?:\s|>)[\s\S]*?<\/w:tr>/g)||[];
 if(rows.length<2)throw new Error("ROWS_NOT_FOUND");
 const templateRow=rows[1];
 const generated=items.map(function(item,i){return setRowData(templateRow,item,i);}).join("");
 const dataRows=rows.slice(1).join("");
 xml=xml.replace(target,target.replace(dataRows,generated));
 zip.file("word/document.xml",xml);
 return await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
async function generateKpPdf(){
 if(!kpCartItems.length){kpSetStatus("Добавьте хотя бы одно направление в КП.","error");return;}
  // Окно открываем сразу по клику, иначе браузер может заблокировать его после await.
 const win=window.open("","_blank");
 if(!win){kpSetStatus("Разрешите всплывающие окна для сайта.","error");return;}
 win.document.open();
 win.document.write('<!doctype html><html><head><title>Формирование КП…</title><style>html,body{margin:0;padding:24px;background:#fff;font-family:Arial,sans-serif;color:#334155}.loading{max-width:720px;margin:15vh auto;text-align:center;font-size:18px}</style><script src="https://unpkg.com/docx-preview@0.3.6/dist/docx-preview.min.js"><\\/script></head><body><div class="loading">Формирую коммерческое предложение…</div></body></html>');
 win.document.close();
 try{
  kpSetStatus("Формирую КП на встроенном Word-шаблоне…");
  const blob=await makeTemplateDocx(kpCartItems);
  await new Promise((resolve,reject)=>{
   const started=Date.now();
   const timer=setInterval(()=>{
    if(win.docx){clearInterval(timer);resolve();}
    else if(Date.now()-started>10000){clearInterval(timer);reject(new Error("Не загрузился модуль отображения Word"));}
   },50);
  });
  win.document.body.innerHTML='<div id="docx"></div>';
  await win.docx.renderAsync(blob,win.document.getElementById("docx"),null,{className:"docx",inWrapper:true,breakPages:true,ignoreWidth:false,ignoreHeight:false});
  const style=win.document.createElement("style");
  style.textContent='@page{size:A4;margin:0}html,body{margin:0;padding:0;background:#fff}.docx-wrapper{background:#fff!important;padding:0!important}.docx{margin:0 auto!important;box-shadow:none!important;page-break-after:always}';
  win.document.head.appendChild(style);
  if(win.document.fonts&&win.document.fonts.ready)await win.document.fonts.ready;
  setTimeout(()=>{win.focus();win.print();},700);
  kpSetStatus("КП открыто в исходной верстке. В окне печати выберите «Сохранить как PDF».","success");
 }catch(e){
  console.error(e);
  try{win.close();}catch{}
  kpSetStatus(e.message==="NO_TEMPLATE"?"Не найден исходный Word-шаблон. Загрузите его через «Загрузить исходный Word»." : "Не удалось сформировать КП: "+e.message,"error");
 }
}
